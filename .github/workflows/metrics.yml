name: Profile Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate coding habits
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-habits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit
          user: yunmin311
          base: ""

          config_timezone: Asia/Shanghai

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_trim: yes
          plugin_habits_languages_limit: 0

      - name: Generate language analysis
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit
          user: yunmin311
          base: ""

          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage, lines
          plugin_languages_analysis_timeout: 10
          plugin_languages_analysis_timeout_repositories: 5

          plugin_languages_skipped: |
            @use.patterns
            */*
            +yunmin311/context-distiller
            +yunmin311/governance-framework
            +yunmin311/window-annotator
            +yunmin311/work-capsule
            +yunmin311/yunmin311.github.io

      - name: Generate recently starred
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-stars.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit
          user: yunmin311
          base: ""

          plugin_stars: yes
          plugin_stars_limit: 3

      - name: Generate recent activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics-activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          output_action: commit
          user: yunmin311
          base: ""

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes
          plugin_activity_filter: issue, pr, release, review, ref/create, public
