name: Rebuild panels

# The generated SVGs are committed rather than built on demand, so the profile
# renders instantly and keeps working if this workflow ever breaks.
on:
  schedule:
    # Every six hours. A README image is a committed file behind an image proxy,
    # so nothing here is live; this is the practical ceiling before the rebuild
    # costs more than the freshness is worth.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/panels.yml"

permissions:
  contents: write
  # Only so a failed rebuild can say why in a place that sends an email. See
  # the last step.
  issues: write

concurrency:
  group: panels
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Cleared before the build so the staleness marker read by the failure
      # step below can only ever reflect THIS run. A leftover file from a
      # previous attempt would otherwise let a scheduled run keep opening an
      # issue about a condition that had already been fixed.
      - name: Clear the staleness marker
        run: rm -f stale-selected-work

      - name: Build
        env:
          # Public data only. The token exists because the contribution
          # calendar and the GraphQL endpoint refuse anonymous requests, not
          # because any private scope is needed.
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        # Every step's output is teed into build.log so the failure step below
        # can quote the actual reason back. `pipefail` is what makes tee safe
        # here: without it the pipeline reports tee's exit code and a failed
        # build passes.
        run: |
          set -o pipefail
          node scripts/build.mjs 2>&1 | tee -a build.log

      # Fails the run if the README points at an asset the build did not
      # produce. A missing phone variant is invisible on a desktop and broken
      # on every phone, so it has to be caught here rather than by a reader.
      - name: Check the README against what was built
        run: |
          set -o pipefail
          node scripts/check.mjs 2>&1 | tee -a build.log

      # Parses every generated SVG. A malformed one fails silently in a README —
      # the slot just stays empty — so it has to be caught by a build.
      - name: Validate every generated SVG
        run: |
          set -o pipefail
          node scripts/validate.mjs 2>&1 | tee -a build.log

      # The tests for SELECTED WORK's selection rule and LANGUAGE SIGNAL's
      # scope. They run on every rebuild rather than only when scripts/ changed,
      # because what they guard against is not a broken edit — it is the rule
      # quietly no longer matching reality, which no amount of looking at a
      # green page would reveal.
      - name: Test the selection and scope rules
        run: |
          set -o pipefail
          node scripts/test-projects.mjs 2>&1 | tee -a build.log

      - name: Commit if anything moved
        run: |
          # README.md is in this list as well as the images: SELECTED WORK's
          # cast changes between runs, and a generated card that is not linked
          # from the page is a card nobody sees. The links are rewritten by the
          # build between SELECTED_WORK_START/END, so the file is generated in
          # the same sense the SVGs are.
          if [ -z "$(git status --porcelain assets/generated README.md)" ]; then
            echo "no change"
            exit 0
          fi
          # Committed as the bot on purpose: a daily automated commit under a
          # personal identity would inflate the very contribution graph this
          # profile displays.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated README.md
          git commit -m "Rebuild panels"
          # A hand push landing between checkout and here would otherwise be
          # rejected as non-fast-forward; this run only ever touches generated
          # files, so replaying it on top is always the right resolution.
          git pull --rebase origin main
          git push

      # WHY THIS EXISTS.
      #
      # The point of keeping every word of this page in scripts/config.json is
      # that it can be edited in the browser without asking anybody. That only
      # works if a bad edit says so. A failed run turns up as a red mark on a
      # tab nobody has open, and the README meanwhile keeps showing the last
      # good version — which is the right behaviour and also means the mistake
      # is completely silent.
      #
      # So the failure gets written where it will send an email, with the
      # actual error quoted rather than a link to go and find it. Scheduled
      # runs are excluded: a rebuild that fails at 05:17 because an API blinked
      # is not something to be woken up for, and it will pass six hours later.
      #
      # EXCEPT when the failure is the SELECTED WORK staleness gate. That is
      # the one failure that does NOT heal on its own: it means the selection
      # rule no longer matches what is actually being worked on, and the whole
      # reason the gate exists is that this used to be completely silent — the
      # page stayed green while the cards went months out of date. A scheduled
      # run is exactly how it would be discovered, so a scheduled run has to be
      # allowed to say so.
      #
      # HOW THE EXCEPTION IS DETECTED. The gate writes a marker file rather than
      # a message, so the check is a file test and not a grep of a log that any
      # unrelated error could accidentally match. The marker is removed at the
      # start of the run so a stale one from a previous attempt cannot keep
      # re-opening the issue.
      #
      # One open issue at a time — further failures are comments on it — so a
      # bad edit left in place for a day does not produce a day of issues.
      - name: Say what went wrong, where it will be seen
        if: failure() && (github.event_name != 'schedule' || hashFiles('stale-selected-work') != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The panel rebuild failed. The README still shows the last good"
            echo "version, so nothing on the page is broken — but the change that"
            echo "triggered this run has not been applied."
            echo
            echo "Most likely cause: an edit to \`scripts/config.json\`. The two that"
            echo "actually happen are a missing or extra comma, and text too long for"
            echo "the space it was given — the build names both."
            echo
            echo "If the log below says \`SELECTED WORK has gone stale\`, the card"
            echo "selection rule has drifted from what is actually being worked on."
            echo "That one is not caused by a bad edit and does not fix itself: add the"
            echo "missing project to \`config.json -> projects\`, or lower the"
            echo "\`hysteresis\` of the card that is holding the slot."
            echo
            echo "Tail of the build:"
            echo
            echo '```'
            tail -n 40 build.log 2>/dev/null || echo "(nothing was captured)"
            echo '```'
            echo
            echo "Full log: $RUN_URL"
          } > /tmp/body.md

          gh label create build-failure --color B60205 \
            --description "A panel rebuild failed" 2>/dev/null || true

          existing=$(gh issue list --label build-failure --state open \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/body.md
          else
            gh issue create --title "Panel rebuild failed" \
              --label build-failure --body-file /tmp/body.md
          fi
